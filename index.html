<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Дни рождения</title>

<style>
:root {
    --bg: #08040f;
    --bg2: #10071b;
    --card: #171022;
    --card2: #1d1430;

    --purple: #8b5cf6;
    --purple-light: #a78bfa;
    --violet: #7c3aed;
    --pink: #d946ef;

    --text: #faf7ff;
    --muted: #9d91b0;

    --border: rgba(167, 139, 250, .15);
    --border-hover: rgba(167, 139, 250, .35);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 5% 0%,
            rgba(139, 92, 246, .22),
            transparent 28%
        ),
        radial-gradient(
            circle at 95% 5%,
            rgba(217, 70, 239, .14),
            transparent 25%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(124, 58, 237, .14),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            var(--bg),
            var(--bg2)
        );

    background-attachment: fixed;
}

.container {
    width: min(1100px, calc(100% - 30px));
    margin: 0 auto;
}

/* ==============================
   HEADER
============================== */

header {
    text-align: center;
    padding: 55px 0 30px;
}

.logo {
    width: 70px;
    height: 70px;

    margin: 0 auto 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 21px;

    font-size: 32px;

    background:
        linear-gradient(
            135deg,
            #6d28d9,
            #8b5cf6,
            #d946ef
        );

    box-shadow:
        0 15px 45px
        rgba(139, 92, 246, .35);
}

header h1 {
    margin: 0;

    font-size:
        clamp(38px, 6vw, 56px);

    line-height: 1.05;

    font-weight: 800;

    letter-spacing: -2px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #c4b5fd,
            #e879f9
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

header p {
    margin: 14px auto 0;

    color: var(--muted);

    font-size: 15px;
}

/* ==============================
   CARDS
============================== */

.form-card,
.section-card,
.month {
    background:
        linear-gradient(
            145deg,
            rgba(139, 92, 246, .08),
            rgba(255, 255, 255, .015)
        ),
        var(--card);

    border: 1px solid var(--border);

    box-shadow:
        0 15px 45px rgba(0, 0, 0, .28);
}

/* ==============================
   FORM
============================== */

.form-card {
    padding: 20px;
    border-radius: 22px;
}

.form-title {
    margin: 0 0 15px;

    font-size: 17px;
    font-weight: 700;
}

#birthday-form {
    display: grid;

    grid-template-columns:
        1.5fr
        .65fr
        1fr
        .8fr
        auto
        auto;

    gap: 10px;
}

input,
select {
    width: 100%;
    height: 46px;

    padding: 0 14px;

    border:
        1px solid
        rgba(167, 139, 250, .15);

    border-radius: 12px;

    outline: none;

    background:
        rgba(8, 5, 17, .65);

    color: var(--text);

    font-size: 14px;

    transition: .2s ease;
}

input::placeholder {
    color: #756b87;
}

input:focus,
select:focus {
    border-color:
        var(--purple-light);

    box-shadow:
        0 0 0 3px
        rgba(139, 92, 246, .12);
}

button {
    height: 46px;

    padding: 0 18px;

    border: 0;

    border-radius: 12px;

    cursor: pointer;

    font-weight: 700;

    color: white;

    transition: .2s ease;
}

button:hover {
    transform: translateY(-2px);
}

button:disabled {
    opacity: .55;
    cursor: wait;
    transform: none;
}

#birthday-form button[type="submit"] {
    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #a855f7,
            #d946ef
        );

    box-shadow:
        0 8px 25px
        rgba(139, 92, 246, .28);
}

#reset {
    background:
        rgba(255, 255, 255, .055);

    color: #c8c0d8;

    border:
        1px solid
        rgba(167, 139, 250, .14);
}

/* ==============================
   STATUS
============================== */

.status {
    margin-top: 12px;

    min-height: 20px;

    text-align: center;

    font-size: 13px;

    color: var(--muted);
}

.status.success {
    color: #c4b5fd;
}

.status.error {
    color: #fda4af;
}

/* ==============================
   SECTION
============================== */

.section {
    margin-top: 28px;
}

.section-card {
    padding: 22px;
    border-radius: 20px;
}

.section-title {
    display: flex;
    align-items: center;

    gap: 10px;

    margin: 0 0 15px;

    font-size: 20px;
}

.section-icon {
    width: 36px;
    height: 36px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background:
        rgba(139, 92, 246, .14);
}

/* ==============================
   SOON
============================== */

.soon-item {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 15px;

    padding: 15px 17px;

    border-radius: 14px;

    background:
        rgba(139, 92, 246, .07);

    border:
        1px solid
        rgba(167, 139, 250, .1);
}

.soon-left {
    display: flex;

    align-items: center;

    gap: 10px;
}

.soon-name {
    font-weight: 700;
}

.soon-date {
    color: var(--muted);
}

.soon-days {
    color: #c4b5fd;

    font-weight: 700;

    white-space: nowrap;
}

/* ==============================
   ACTIONS
============================== */

.actions {
    display: flex;
    justify-content: center;

    margin: 14px 0 0;
}

#download {
    background:
        linear-gradient(
            135deg,
            #4f46e5,
            #7c3aed
        );
}

/* ==============================
   MONTHS
============================== */

#months {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 16px;

    margin-top: 28px;

    padding-bottom: 30px;
}

.month {
    overflow: hidden;

    border-radius: 18px;

    transition: .25s ease;
}

.month:hover {
    transform: translateY(-4px);

    border-color:
        var(--border-hover);
}

.month-title {
    padding: 15px 17px;

    font-size: 15px;

    font-weight: 700;

    color: #ddd6fe;

    background:
        linear-gradient(
            90deg,
            rgba(139, 92, 246, .13),
            rgba(232, 121, 249, .045)
        );

    border-bottom:
        1px solid
        rgba(167, 139, 250, .1);
}

.month-list {
    list-style: none;

    margin: 0;
    padding: 6px;
}

/* ==============================
   PERSON
============================== */

.person {
    display: grid;

    grid-template-columns:
        42px 1fr;

    column-gap: 10px;

    align-items: center;

    padding: 10px;

    border-radius: 12px;

    transition: .2s ease;
}

.person:hover {
    background:
        rgba(139, 92, 246, .085);
}

.person-day {
    width: 38px;
    height: 38px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 10px;

    font-weight: 800;

    color: #ddd6fe;

    background:
        linear-gradient(
            135deg,
            rgba(139, 92, 246, .2),
            rgba(99, 102, 241, .12)
        );
}

.person-content {
    min-width: 0;

    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 8px;
}

.person-name {
    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-weight: 600;
}

.person-age {
    grid-column: 2;

    color: var(--muted);

    font-size: 12px;
}

/* ==============================
   DELETE
============================== */

.delete-person {
    flex-shrink: 0;

    width: 28px;
    height: 28px;

    padding: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 8px;

    color: #d8b4fe;

    background:
        rgba(232, 121, 249, .07);

    border:
        1px solid
        rgba(232, 121, 249, .12);

    font-size: 19px;

    opacity: 0;

    transform: scale(.8);
}

.person:hover .delete-person {
    opacity: 1;

    transform: scale(1);
}

.delete-person:hover {
    color: white;

    background:
        rgba(239, 68, 68, .8);
}

/* ==============================
   EDIT
============================== */

.edit-person {
    flex-shrink: 0;

    width: 28px;
    height: 28px;

    padding: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 8px;

    color: #c4b5fd;

    background:
        rgba(139, 92, 246, .08);

    font-size: 14px;

    opacity: 0;

    transform: scale(.8);
}

.person:hover .edit-person {
    opacity: 1;

    transform: scale(1);
}

.edit-person:hover {
    background:
        rgba(139, 92, 246, .35);
}

/* ==============================
   FOOTER
============================== */

footer {
    padding: 15px 0 45px;

    text-align: center;

    color: #a78bfa;

    font-size: 13px;

    font-weight: 700;

    letter-spacing: .3px;
}

/* ==============================
   LOADING
============================== */

.loading {
    padding: 25px;

    text-align: center;

    color: var(--muted);
}

.empty {
    padding: 15px;

    text-align: center;

    color: var(--muted);

    font-size: 13px;
}

/* ==============================
   MOBILE
============================== */

@media(max-width: 1000px) {

    #birthday-form {
        grid-template-columns:
            repeat(3, 1fr);
    }
}

@media(max-width: 800px) {

    #months {
        grid-template-columns:
            repeat(2, 1fr);
    }

    #birthday-form {
        grid-template-columns:
            repeat(2, 1fr);
    }
}

@media(max-width: 560px) {

    .container {
        width:
            calc(100% - 20px);
    }

    header {
        padding:
            35px 0 25px;
    }

    #birthday-form {
        grid-template-columns:
            1fr;
    }

    #months {
        grid-template-columns:
            1fr;
    }

    .soon-item {
        flex-direction:
            column;

        align-items:
            flex-start;
    }

    .delete-person,
    .edit-person {
        opacity: .7;

        transform: scale(1);
    }
}
</style>
</head>

<body>

<div class="container">

<header>

    <div class="logo">
        🎂
    </div>

    <h1>
        Дни рождения
    </h1>

    <p>
        Все важные даты в одном красивом месте
    </p>

</header>


<section class="form-card">

    <h2 class="form-title">
        Добавить участника
    </h2>

    <form id="birthday-form">

        <input
            id="name"
            type="text"
            placeholder="Имя участника"
            autocomplete="off"
            required
        >

        <input
            id="day"
            type="number"
            min="1"
            max="31"
            placeholder="День"
            required
        >

        <select id="month"></select>

        <input
            id="birthYear"
            type="number"
            min="1900"
            max="2100"
            placeholder="Год рождения"
            required
        >

        <button type="submit">
            Добавить
        </button>

        <button
            type="button"
            id="reset"
        >
            Сбросить
        </button>

    </form>

    <div
        id="status"
        class="status"
    ></div>

</section>


<section class="section">

    <div class="section-card">

        <h2 class="section-title">

            <span class="section-icon">
                🎉
            </span>

            Скоро

        </h2>

        <div id="soon-list">

            <div class="loading">
                Загрузка...
            </div>

        </div>

    </div>

</section>


<div class="actions">

    <button id="download">
        ↓ Скачать birthdays.json
    </button>

</div>


<main id="months">

    <div class="loading">
        Загрузка дней рождения...
    </div>

</main>


<footer>
    Created by quelby
</footer>

</div>


<script>

/* =========================================================
   GITHUB НАСТРОЙКИ
   =========================================================

   ЗАМЕНИ ТОЛЬКО ЭТИ 4 ЗНАЧЕНИЯ.
*/


const GITHUB_OWNER =
    "azwyyier";


const GITHUB_REPO =
    "birthday-blade";


const GITHUB_FILE =
    "data/birthdays.json";


const GITHUB_BRANCH =
    "main";


const GITHUB_TOKEN =
    "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";


/* =========================================================
   ОСТАЛЬНОЙ КОД
========================================================= */

const API_BASE =
    "https://api.github.com";


const MONTHS = [

    "Январь",
    "Февраль",
    "Март",
    "Апрель",
    "Май",
    "Июнь",
    "Июль",
    "Август",
    "Сентябрь",
    "Октябрь",
    "Ноябрь",
    "Декабрь"

];


let birthdays = [];

let fileSha = null;

let saving = false;


/* =========================================================
   DOM
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        createMonthSelect();

        document
            .getElementById("birthday-form")
            .addEventListener(
                "submit",
                addBirthday
            );


        document
            .getElementById("reset")
            .addEventListener(
                "click",
                clearForm
            );


        document
            .getElementById("download")
            .addEventListener(
                "click",
                downloadJSON
            );


        await loadBirthdays();

    }
);


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text,
    type = ""
) {

    const element =
        document.getElementById(
            "status"
        );


    element.textContent =
        text;


    element.className =
        "status " + type;
}


/* =========================================================
   GITHUB API
========================================================= */

function githubHeaders() {

    return {

        "Accept":
            "application/vnd.github+json",

        "Authorization":
            `Bearer ${GITHUB_TOKEN}`,

        "X-GitHub-Api-Version":
            "2026-03-10"

    };
}


/* =========================================================
   GET FILE FROM GITHUB
========================================================= */

async function getGitHubFile() {

    const url =
        `${API_BASE}/repos/` +
        `${GITHUB_OWNER}/` +
        `${GITHUB_REPO}/contents/` +
        `${GITHUB_FILE}?ref=${encodeURIComponent(
            GITHUB_BRANCH
        )}`;


    const response =
        await fetch(
            url,
            {
                headers:
                    githubHeaders(),

                cache:
                    "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            `GitHub GET error: ${response.status}`
        );
    }


    return await response.json();
}


/* =========================================================
   LOAD BIRTHDAYS
========================================================= */

async function loadBirthdays() {

    try {

        if (
            !GITHUB_TOKEN ||
            GITHUB_TOKEN.includes(
                "ВСТАВЬ"
            )
        ) {

            throw new Error(
                "Не указан GitHub Token."
            );
        }


        const file =
            await getGitHubFile();


        fileSha =
            file.sha;


        const decoded =
            decodeBase64Utf8(
                file.content
            );


        const data =
            JSON.parse(decoded);


        if (
            !Array.isArray(data)
        ) {

            throw new Error(
                "birthdays.json должен содержать массив."
            );
        }


        birthdays =
            normalizeData(data);


        render();


        setStatus(
            `Загружено участников: ${birthdays.length}`,
            "success"
        );


    } catch (error) {

        console.error(error);


        birthdays = [];


        document
            .getElementById("months")
            .innerHTML = `
                <div class="loading">
                    Не удалось загрузить birthdays.json.
                    <br><br>
                    Проверь GitHub Token,
                    репозиторий и путь к файлу.
                </div>
            `;


        setStatus(
            error.message,
            "error"
        );
    }
}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeData(data) {

    return data
        .filter(
            person =>
                person &&
                person.name &&
                person.day &&
                person.month &&
                person.birthYear
        )
        .map(
            person => ({

                name:
                    String(
                        person.name
                    ),

                day:
                    Number(
                        person.day
                    ),

                month:
                    Number(
                        person.month
                    ),

                birthYear:
                    Number(
                        person.birthYear
                    )

            })
        );
}


/* =========================================================
   MONTH SELECT
========================================================= */

function createMonthSelect() {

    const select =
        document.getElementById(
            "month"
        );


    select.innerHTML = "";


    MONTHS.forEach(
        (month, index) => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                index + 1;


            option.textContent =
                month;


            select.appendChild(
                option
            );

        }
    );
}


/* =========================================================
   SAVE TO GITHUB
========================================================= */

async function saveToGitHub(
    commitMessage
) {

    if (saving) {

        throw new Error(
            "Подожди, предыдущая операция ещё выполняется."
        );
    }


    saving = true;


    try {

        /*
           Перед сохранением заново получаем SHA.

           Это важно, если другой человек
           только что изменил файл.
        */

        const latest =
            await getGitHubFile();


        fileSha =
            latest.sha;


        const json =
            JSON.stringify(
                birthdays,
                null,
                2
            ) + "\n";


        const encoded =
            encodeBase64Utf8(
                json
            );


        const url =
            `${API_BASE}/repos/` +
            `${GITHUB_OWNER}/` +
            `${GITHUB_REPO}/contents/` +
            `${GITHUB_FILE}`;


        const response =
            await fetch(
                url,
                {

                    method:
                        "PUT",

                    headers: {
                        ...githubHeaders(),

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                commitMessage,

                            content:
                                encoded,

                            sha:
                                fileSha,

                            branch:
                                GITHUB_BRANCH

                        })
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            console.error(
                result
            );


            throw new Error(
                result.message ||
                `GitHub error: ${response.status}`
            );
        }


        fileSha =
            result.content.sha;


    } finally {

        saving = false;
    }
}


/* =========================================================
   ADD
========================================================= */

async function addBirthday(
    event
) {

    event.preventDefault();


    const name =
        document
            .getElementById("name")
            .value
            .trim();


    const day =
        Number(
            document
                .getElementById("day")
                .value
        );


    const month =
        Number(
            document
                .getElementById("month")
                .value
        );


    const birthYear =
        Number(
            document
                .getElementById("birthYear")
                .value
        );


    if (!name) {

        alert(
            "Введите имя."
        );

        return;
    }


    if (
        !Number.isInteger(day) ||
        day < 1 ||
        day > daysInMonth(month)
    ) {

        alert(
            "Введите правильный день."
        );

        return;
    }


    const currentYear =
        new Date()
            .getFullYear();


    if (
        !Number.isInteger(
            birthYear
        ) ||

        birthYear < 1900 ||

        birthYear > currentYear
    ) {

        alert(
            "Введите правильный год рождения."
        );

        return;
    }


    const birthday = {

        name,

        day,

        month,

        birthYear

    };


    birthdays.push(
        birthday
    );


    birthdays.sort(
        compareBirthdays
    );


    render();


    setStatus(
        "Сохраняем в GitHub...",
        ""
    );


    try {

        await saveToGitHub(
            `Добавлен день рождения: ${name}`
        );


        clearForm();


        setStatus(
            `${name} добавлен в birthdays.json`,
            "success"
        );


        /*
           Повторно загружаем файл,
           чтобы убедиться, что версия
           на GitHub актуальна.
        */

        await refreshFromGitHub();


    } catch (error) {

        console.error(error);


        /*
           Если сохранение не удалось,
           удаляем локально добавленную
           запись обратно.
        */

        birthdays =
            birthdays.filter(
                person =>
                    person !== birthday
            );


        render();


        setStatus(
            "Ошибка сохранения: " +
            error.message,
            "error"
        );


        alert(
            "Не удалось сохранить запись в GitHub.\n\n" +
            error.message
        );
    }
}


/* =========================================================
   DELETE
========================================================= */

async function deleteBirthday(
    person
) {

    const confirmed =
        confirm(
            `Удалить ${person.name}?`
        );


    if (!confirmed) {
        return;
    }


    const oldData =
        [...birthdays];


    birthdays =
        birthdays.filter(
            item =>
                item !== person
        );


    render();


    setStatus(
        "Удаляем из GitHub...",
        ""
    );


    try {

        await saveToGitHub(
            `Удалён день рождения: ${person.name}`
        );


        setStatus(
            `${person.name} удалён`,
            "success"
        );


        await refreshFromGitHub();


    } catch (error) {

        console.error(error);


        birthdays =
            oldData;


        render();


        setStatus(
            "Ошибка удаления: " +
            error.message,
            "error"
        );


        alert(
            "Не удалось удалить запись.\n\n" +
            error.message
        );
    }
}


/* =========================================================
   EDIT
========================================================= */

async function editBirthday(
    person
) {

    const newName =
        prompt(
            "Имя участника:",
            person.name
        );


    if (
        newName === null
    ) {

        return;
    }


    const cleanName =
        newName.trim();


    if (!cleanName) {

        alert(
            "Имя не может быть пустым."
        );

        return;
    }


    const newDay =
        prompt(
            "День рождения:",
            person.day
        );


    if (
        newDay === null
    ) {

        return;
    }


    const newMonth =
        prompt(
            "Месяц (1-12):",
            person.month
        );


    if (
        newMonth === null
    ) {

        return;
    }


    const newYear =
        prompt(
            "Год рождения:",
            person.birthYear
        );


    if (
        newYear === null
    ) {

        return;
    }


    const day =
        Number(newDay);


    const month =
        Number(newMonth);


    const birthYear =
        Number(newYear);


    const currentYear =
        new Date()
            .getFullYear();


    if (
        !Number.isInteger(day) ||
        day < 1 ||
        day > daysInMonth(month)
    ) {

        alert(
            "Неправильный день."
        );

        return;
    }


    if (
        !Number.isInteger(month) ||
        month < 1 ||
        month > 12
    ) {

        alert(
            "Неправильный месяц."
        );

        return;
    }


    if (
        !Number.isInteger(
            birthYear
        ) ||

        birthYear < 1900 ||

        birthYear > currentYear
    ) {

        alert(
            "Неправильный год рождения."
        );

        return;
    }


    const oldName =
        person.name;


    person.name =
        cleanName;


    person.day =
        day;


    person.month =
        month;


    person.birthYear =
        birthYear;


    birthdays.sort(
        compareBirthdays
    );


    render();


    setStatus(
        "Сохраняем изменения...",
        ""
    );


    try {

        await saveToGitHub(
            `Изменён день рождения: ${oldName}`
        );


        setStatus(
            "Изменения сохранены",
            "success"
        );


        await refreshFromGitHub();


    } catch (error) {

        console.error(error);


        /*
           Если ошибка,
           перезагружаем актуальную
           версию с GitHub.
        */

        await refreshFromGitHub();


        setStatus(
            "Ошибка изменения: " +
            error.message,
            "error"
        );


        alert(
            "Не удалось изменить запись.\n\n" +
            error.message
        );
    }
}


/* =========================================================
   REFRESH
========================================================= */

async function refreshFromGitHub() {

    const file =
        await getGitHubFile();


    fileSha =
        file.sha;


    const decoded =
        decodeBase64Utf8(
            file.content
        );


    birthdays =
        normalizeData(
            JSON.parse(decoded)
        );


    render();
}


/* =========================================================
   RENDER
========================================================= */

function render() {

    renderMonths();

    renderSoon();
}


/* =========================================================
   MONTHS
========================================================= */

function renderMonths() {

    const container =
        document.getElementById(
            "months"
        );


    container.innerHTML = "";


    MONTHS.forEach(
        (monthName, index) => {

            const monthNumber =
                index + 1;


            const people =
                birthdays
                    .filter(
                        person =>
                            Number(
                                person.month
                            ) ===
                            monthNumber
                    )
                    .sort(
                        compareBirthdays
                    );


            const month =
                document.createElement(
                    "article"
                );


            month.className =
                "month";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "month-title";


            title.textContent =
                `${monthName} · ${people.length}`;


            const list =
                document.createElement(
                    "ul"
                );


            list.className =
                "month-list";


            if (
                people.length === 0
            ) {

                const empty =
                    document.createElement(
                        "li"
                    );


                empty.className =
                    "empty";


                empty.textContent =
                    "Пока никого нет.";


                list.appendChild(
                    empty
                );
            }


            people.forEach(
                person => {

                    list.appendChild(
                        createPersonElement(
                            person
                        )
                    );

                }
            );


            month.appendChild(
                title
            );


            month.appendChild(
                list
            );


            container.appendChild(
                month
            );

        }
    );
}

/* =========================================================
   AGE
========================================================= */

function getCurrentAge(
    person
) {

    const today =
        new Date();


    const currentYear =
        today.getFullYear();


    let age =
        currentYear -
        Number(person.birthYear);


    const birthday =
        new Date(
            currentYear,
            Number(person.month) - 1,
            Number(person.day)
        );


    today.setHours(
        0,
        0,
        0,
        0
    );


    birthday.setHours(
        0,
        0,
        0,
        0
    );


    if (
        today < birthday
    ) {

        age--;
    }


    return age;
}


/* =========================================================
   SOON
========================================================= */

function renderSoon() {

    const container =
        document.getElementById(
            "soon-list"
        );


    container.innerHTML = "";


    if (
        birthdays.length === 0
    ) {

        container.innerHTML = `
            <div class="empty">
                Пока нет дней рождения.
            </div>
        `;


        return;
    }


    const today =
        new Date();


    today.setHours(
        0,
        0,
        0,
        0
    );


    const upcoming =
        birthdays
            .map(
                person => {

                    const date =
                        nextBirthday(
                            person,
                            today
                        );


                    const days =
                        Math.round(
                            (
                                date.getTime()
                                -
                                today.getTime()
                            )
                            /
                            86400000
                        );


                    return {

                        person,

                        date,

                        days

                    };
                }
            )
            .sort(
                (a, b) =>
                    a.days -
                    b.days
            );


    const next =
        upcoming[0];


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "soon-item";


    const left =
        document.createElement(
            "div"
        );


    left.className =
        "soon-left";


    const name =
        document.createElement(
            "span"
        );


    name.className =
        "soon-name";


    name.textContent =
        next.person.name;


    const date =
        document.createElement(
            "span"
        );


    date.className =
        "soon-date";


    date.textContent =
        `· ${formatDate(
            next.person
        )}`;


    left.appendChild(
        name
    );


    left.appendChild(
        date
    );


    const days =
        document.createElement(
            "span"
        );


    days.className =
        "soon-days";


    days.textContent =
        formatDays(
            next.days
        );


    row.appendChild(
        left
    );


    row.appendChild(
        days
    );


    container.appendChild(
        row
    );
}


/* =========================================================
   NEXT BIRTHDAY
========================================================= */

function nextBirthday(
    person,
    today
) {

    const year =
        today.getFullYear();


    let date =
        new Date(
            year,
            Number(person.month) - 1,
            Number(person.day)
        );


    date.setHours(
        0,
        0,
        0,
        0
    );


    if (
        date < today
    ) {

        date =
            new Date(
                year + 1,
                Number(person.month) - 1,
                Number(person.day)
            );


        date.setHours(
            0,
            0,
            0,
            0
        );
    }


    return date;
}

/* =========================================================
   SORT
========================================================= */

function compareBirthdays(
    a,
    b
) {

    const monthA =
        Number(a.month);


    const monthB =
        Number(b.month);


    if (
        monthA !== monthB
    ) {

        return (
            monthA -
            monthB
        );
    }


    const dayA =
        Number(a.day);


    const dayB =
        Number(b.day);


    if (
        dayA !== dayB
    ) {

        return (
            dayA -
            dayB
        );
    }


    return String(a.name)
        .localeCompare(
            String(b.name),
            "ru"
        );
}


/* =========================================================
   DAYS IN MONTH
========================================================= */

function daysInMonth(
    month
) {

    if (
        month < 1 ||
        month > 12
    ) {

        return 0;
    }


    return new Date(
        2024,
        month,
        0
    ).getDate();
}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(
    person
) {

    return (

        String(
            person.day
        ).padStart(2, "0")

        +

        "."

        +

        String(
            person.month
        ).padStart(2, "0")

    );
}


/* =========================================================
   FORMAT DAYS
========================================================= */

function formatDays(
    days
) {

    if (
        days === 0
    ) {

        return "сегодня 🎉";
    }


    if (
        days === 1
    ) {

        return "завтра";
    }


    return (
        `через ${days} ${daysWord(days)}`
    );
}


function daysWord(
    number
) {

    const n =
        Math.abs(number)
        % 100;


    const last =
        n % 10;


    if (
        n >= 11 &&
        n <= 19
    ) {

        return "дней";
    }


    if (
        last === 1
    ) {

        return "день";
    }


    if (
        last >= 2 &&
        last <= 4
    ) {

        return "дня";
    }


    return "дней";
}


/* =========================================================
   YEARS WORD
========================================================= */

function yearsWord(
    number
) {

    const n =
        Math.abs(number)
        % 100;


    const last =
        n % 10;


    if (
        n >= 11 &&
        n <= 19
    ) {

        return "лет";
    }


    if (
        last === 1
    ) {

        return "год";
    }


    if (
        last >= 2 &&
        last <= 4
    ) {

        return "года";
    }


    return "лет";
}


/* =========================================================
   UTF-8 BASE64
========================================================= */

function encodeBase64Utf8(
    text
) {

    const bytes =
        new TextEncoder()
            .encode(text);


    let binary = "";


    const chunkSize =
        0x8000;


    for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
    ) {

        const chunk =
            bytes.subarray(
                i,
                i + chunkSize
            );


        binary +=
            String.fromCharCode(
                ...chunk
            );
    }


    return btoa(
        binary
    );
}


function decodeBase64Utf8(
    base64
) {

    const binary =
        atob(
            base64.replace(
                /\n/g,
                ""
            )
        );


    const bytes =
        Uint8Array.from(
            binary,
            char =>
                char.charCodeAt(0)
        );


    return new TextDecoder(
        "utf-8"
    ).decode(
        bytes
    );
}
