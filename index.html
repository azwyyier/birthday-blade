<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Дни рождения</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #090511;
    --card: #171022;
    --card2: #1e1530;
    --purple: #8b5cf6;
    --purple2: #a855f7;
    --pink: #d946ef;
    --text: #faf7ff;
    --muted: #9c91ad;
    --border: rgba(167,139,250,.16);
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(139,92,246,.25),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 0%,
            rgba(217,70,239,.16),
            transparent 25%
        ),
        linear-gradient(
            180deg,
            #090511,
            #10071a
        );
}

.container {
    width: min(1100px, calc(100% - 24px));
    margin: auto;
}

/* HEADER */

header {
    text-align: center;
    padding: 50px 0 30px;
}

.logo {
    width: 68px;
    height: 68px;

    margin: 0 auto 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 20px;

    font-size: 32px;

    background:
        linear-gradient(
            135deg,
            #6d28d9,
            #8b5cf6,
            #d946ef
        );

    box-shadow:
        0 15px 45px
        rgba(139,92,246,.35);
}

h1 {
    margin: 0;

    font-size: clamp(38px,6vw,56px);

    letter-spacing: -2px;

    background:
        linear-gradient(
            135deg,
            white,
            #c4b5fd,
            #e879f9
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

header p {
    color: var(--muted);
}

/* CARDS */

.card {
    background:
        linear-gradient(
            145deg,
            rgba(139,92,246,.08),
            rgba(255,255,255,.015)
        ),
        var(--card);

    border:
        1px solid var(--border);

    border-radius: 20px;

    padding: 20px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.3);
}

/* TOKEN */

.token-box {
    margin-bottom: 20px;
}

.token-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
}

.token-row {
    display: flex;
    gap: 10px;
}

.token-row input {
    flex: 1;
}

/* FORM */

.form-title {
    margin-bottom: 14px;
    font-weight: 700;
}

form {
    display: grid;

    grid-template-columns:
        1.5fr
        .7fr
        1fr
        .9fr
        auto
        auto;

    gap: 10px;
}

input,
select {
    width: 100%;
    height: 46px;

    padding: 0 13px;

    border-radius: 12px;

    border:
        1px solid
        rgba(167,139,250,.16);

    outline: none;

    background:
        rgba(5,3,10,.65);

    color: white;
}

input:focus,
select:focus {
    border-color: var(--purple);

    box-shadow:
        0 0 0 3px
        rgba(139,92,246,.12);
}

button {
    height: 46px;

    border: 0;

    border-radius: 12px;

    padding: 0 18px;

    color: white;

    font-weight: 700;

    cursor: pointer;

    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
}

.primary {
    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #a855f7,
            #d946ef
        );
}

.secondary {
    background:
        rgba(255,255,255,.06);
}

.status {
    min-height: 22px;

    margin-top: 12px;

    text-align: center;

    color: var(--muted);

    font-size: 13px;
}

.success {
    color: #c4b5fd;
}

.error {
    color: #fb7185;
}

/* SOON */

.section {
    margin-top: 24px;
}

.section h2 {
    margin-top: 0;
}

.soon {
    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 15px;

    border-radius: 13px;

    background:
        rgba(139,92,246,.07);
}

.soon-name {
    font-weight: 700;
}

.soon-date {
    color: var(--muted);
    margin-left: 8px;
}

.soon-days {
    color: #c4b5fd;
    font-weight: 700;
}

/* MONTHS */

#months {
    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 15px;

    margin-top: 25px;

    padding-bottom: 30px;
}

.month {
    overflow: hidden;

    background: var(--card);

    border:
        1px solid var(--border);

    border-radius: 18px;
}

.month-title {
    padding: 15px;

    font-weight: 700;

    color: #ddd6fe;

    background:
        linear-gradient(
            90deg,
            rgba(139,92,246,.14),
            rgba(217,70,239,.04)
        );
}

.month-list {
    list-style: none;

    margin: 0;
    padding: 6px;
}

.person {
    display: grid;

    grid-template-columns:
        42px 1fr;

    gap: 10px;

    padding: 10px;

    border-radius: 12px;
}

.person:hover {
    background:
        rgba(139,92,246,.08);
}

.day {
    width: 38px;
    height: 38px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 10px;

    color: #ddd6fe;

    background:
        rgba(139,92,246,.16);

    font-weight: 800;
}

.person-main {
    min-width: 0;
}

.person-top {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 5px;
}

.name {
    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-weight: 600;
}

.age {
    margin-top: 3px;

    color: var(--muted);

    font-size: 12px;
}

.person-buttons {
    display: flex;

    gap: 4px;
}

.icon-btn {
    width: 28px;
    height: 28px;

    padding: 0;

    opacity: 0;

    background:
        rgba(139,92,246,.1);

    color: #c4b5fd;
}

.person:hover .icon-btn {
    opacity: 1;
}

.delete:hover {
    background: #dc2626;
}

footer {
    text-align: center;

    padding:
        15px 0 45px;

    color: #a78bfa;

    font-size: 13px;

    font-weight: 700;
}

.empty {
    padding: 15px;

    text-align: center;

    color: var(--muted);

    font-size: 13px;
}

@media(max-width:900px) {

    form {
        grid-template-columns:
            repeat(3,1fr);
    }

    #months {
        grid-template-columns:
            repeat(2,1fr);
    }
}

@media(max-width:600px) {

    form {
        grid-template-columns: 1fr;
    }

    #months {
        grid-template-columns: 1fr;
    }

    .token-row {
        flex-direction: column;
    }

    .soon {
        flex-direction: column;

        align-items: flex-start;

        gap: 8px;
    }

    .icon-btn {
        opacity: .8;
    }
}
</style>
</head>

<body>

<div class="container">

<header>

    <div class="logo">🎂</div>

    <h1>Дни рождения</h1>

    <p>
        Все важные даты в одном красивом месте
    </p>

</header>


<!-- TOKEN -->

<div class="card token-box">

    <div class="token-title">
        🔑 Подключение к GitHub
    </div>

    <div class="token-row">

        <input
            id="token"
            type="password"
            placeholder="Вставь GitHub Token"
        >

        <button
            class="primary"
            id="connect"
        >
            Подключить
        </button>

    </div>

    <div
        id="token-status"
        class="status"
    ></div>

</div>


<!-- FORM -->

<div class="card">

    <div class="form-title">
        Добавить участника
    </div>

    <form id="form">

        <input
            id="name"
            placeholder="Имя участника"
            required
        >

        <input
            id="day"
            type="number"
            min="1"
            max="31"
            placeholder="День"
            required
        >

        <select id="month"></select>

        <input
            id="year"
            type="number"
            min="1900"
            max="2100"
            placeholder="Год рождения"
            required
        >

        <button
            class="primary"
            type="submit"
        >
            Добавить
        </button>

        <button
            class="secondary"
            type="button"
            id="reset"
        >
            Сбросить
        </button>

    </form>

    <div
        id="status"
        class="status"
    ></div>

</div>


<!-- SOON -->

<div class="section card">

    <h2>
        🎉 Скоро
    </h2>

    <div id="soon">
        <div class="empty">
            Подключение к GitHub...
        </div>
    </div>

</div>


<!-- MONTHS -->

<div id="months">

    <div class="card empty">
        Подключение к GitHub...
    </div>

</div>


<footer>
    Created by quelby
</footer>

</div>


<script>

/* =========================================
   GITHUB
========================================= */

const OWNER = "azwyyier";
const REPO = "birthday-blade";
const FILE = "data/birthdays.json";
const BRANCH = "main";

const API =
    "https://api.github.com";


/* =========================================
   STATE
========================================= */

let token =
    localStorage.getItem(
        "github_token"
    ) || "";

let birthdays = [];

let sha = null;

let busy = false;


/* =========================================
   MONTHS
========================================= */

const MONTHS = [
    "Январь",
    "Февраль",
    "Март",
    "Апрель",
    "Май",
    "Июнь",
    "Июль",
    "Август",
    "Сентябрь",
    "Октябрь",
    "Ноябрь",
    "Декабрь"
];


const monthSelect =
    document.getElementById(
        "month"
    );


MONTHS.forEach(
    (month, index) => {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            index + 1;

        option.textContent =
            month;

        monthSelect.appendChild(
            option
        );
    }
);


/* =========================================
   TOKEN
========================================= */

const tokenInput =
    document.getElementById(
        "token"
    );


if (token) {

    tokenInput.value =
        token;

    load();

}


document
    .getElementById("connect")
    .addEventListener(
        "click",
        async () => {

            const value =
                tokenInput
                    .value
                    .trim();

            if (!value) {

                showToken(
                    "Вставь GitHub Token",
                    true
                );

                return;
            }

            token = value;

            localStorage.setItem(
                "github_token",
                token
            );

            await load();
        }
    );


/* =========================================
   HEADERS
========================================= */

function headers() {

    return {

        "Accept":
            "application/vnd.github+json",

        "Authorization":
            "Bearer " + token,

        "X-GitHub-Api-Version":
            "2026-03-10",

        "Content-Type":
            "application/json"
    };
}


/* =========================================
   GET FILE
========================================= */

async function getFile() {

    const url =
        `${API}/repos/` +
        `${OWNER}/` +
        `${REPO}/contents/` +
        `${FILE}?ref=${BRANCH}`;

    const response =
        await fetch(
            url,
            {
                headers:
                    headers(),

                cache:
                    "no-store"
            }
        );


    if (!response.ok) {

        if (
            response.status === 401
        ) {

            throw new Error(
                "GitHub отклонил Token (401). Создай новый Fine-grained token."
            );
        }

        if (
            response.status === 404
        ) {

            throw new Error(
                "GitHub не нашёл birthdays.json."
            );
        }

        throw new Error(
            `GitHub ошибка ${response.status}`
        );
    }


    return response.json();
}


/* =========================================
   LOAD
========================================= */

async function load() {

    if (!token) {

        return;
    }


    try {

        showToken(
            "Подключение...",
            false
        );


        const file =
            await getFile();


        sha =
            file.sha;


        const text =
            decode(
                file.content
            );


        birthdays =
            JSON.parse(text);


        if (
            !Array.isArray(
                birthdays
            )
        ) {

            throw new Error(
                "birthdays.json должен быть массивом."
            );
        }


        render();


        showToken(
            "✓ GitHub подключён",
            false
        );


    } catch (error) {

        console.error(
            error
        );


        showToken(
            error.message,
            true
        );
    }
}


/* =========================================
   SAVE
========================================= */

async function save(
    message
) {

    if (busy) {

        throw new Error(
            "Подожди завершения предыдущей операции."
        );
    }


    busy = true;


    try {

        /*
           Получаем свежий SHA.
        */

        const current =
            await getFile();


        sha =
            current.sha;


        const content =
            JSON.stringify(
                birthdays,
                null,
                2
            ) + "\n";


        const response =
            await fetch(
                `${API}/repos/${OWNER}/${REPO}/contents/${FILE}`,
                {

                    method:
                        "PUT",

                    headers:
                        headers(),

                    body:
                        JSON.stringify({

                            message,

                            content:
                                encode(
                                    content
                                ),

                            sha,

                            branch:
                                BRANCH

                        })
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                `Ошибка GitHub ${response.status}`
            );
        }


        sha =
            result.content.sha;


    } finally {

        busy = false;
    }
}


/* =========================================
   ADD
========================================= */

document
    .getElementById("form")
    .addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            if (!token) {

                alert(
                    "Сначала подключи GitHub."
                );

                return;
            }


            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const day =
                Number(
                    document
                        .getElementById("day")
                        .value
                );


            const month =
                Number(
                    document
                        .getElementById("month")
                        .value
                );


            const birthYear =
                Number(
                    document
                        .getElementById("year")
                        .value
                );


            if (
                !name
            ) {

                alert(
                    "Введите имя."
                );

                return;
            }


            if (
                day < 1 ||
                day >
                daysInMonth(month)
            ) {

                alert(
                    "Неправильный день."
                );

                return;
            }


            const currentYear =
                new Date()
                    .getFullYear();


            if (
                birthYear <
                    1900 ||
                birthYear >
                    currentYear
            ) {

                alert(
                    "Неправильный год рождения."
                );

                return;
            }


            const person = {

                name,

                day,

                month,

                birthYear
            };


            birthdays.push(
                person
            );


            sort();


            render();


            status(
                "Сохраняем...",
                false
            );


            try {

                await save(
                    `Добавлен день рождения: ${name}`
                );


                document
                    .getElementById(
                        "form"
                    )
                    .reset();


                monthSelect.value =
                    "1";


                status(
                    "✓ Сохранено в GitHub",
                    false
                );


            } catch (error) {

                birthdays =
                    birthdays.filter(
                        x =>
                            x !== person
                    );


                render();


                status(
                    error.message,
                    true
                );

                alert(
                    error.message
                );
            }

        }
    );


/* =========================================
   RESET
========================================= */

document
    .getElementById("reset")
    .addEventListener(
        "click",
        () => {

            document
                .getElementById(
                    "form"
                )
                .reset();

            monthSelect.value =
                "1";

            document
                .getElementById(
                    "name"
                )
                .focus();

            status(
                "",
                false
            );
        }
    );


/* =========================================
   DELETE
========================================= */

async function remove(
    person
) {

    if (
        !confirm(
            `Удалить ${person.name}?`
        )
    ) {

        return;
    }


    const old =
        [...birthdays];


    birthdays =
        birthdays.filter(
            x =>
                x !== person
        );


    render();


    status(
        "Удаляем...",
        false
    );


    try {

        await save(
            `Удалён день рождения: ${person.name}`
        );


        status(
            "✓ Запись удалена",
            false
        );


    } catch (error) {

        birthdays =
            old;

        render();

        status(
            error.message,
            true
        );

        alert(
            error.message
        );
    }
}


/* =========================================
   EDIT
========================================= */

async function edit(
    person
) {

    const name =
        prompt(
            "Имя:",
            person.name
        );


    if (
        name === null
    ) {

        return;
    }


    const day =
        prompt(
            "День:",
            person.day
        );


    if (
        day === null
    ) {

        return;
    }


    const month =
        prompt(
            "Месяц (1-12):",
            person.month
        );


    if (
        month === null
    ) {

        return;
    }


    const year =
        prompt(
            "Год рождения:",
            person.birthYear
        );


    if (
        year === null
    ) {

        return;
    }


    const newDay =
        Number(day);

    const newMonth =
        Number(month);

    const newYear =
        Number(year);


    if (
        newDay < 1 ||
        newDay >
        daysInMonth(newMonth)
    ) {

        alert(
            "Неправильный день."
        );

        return;
    }


    const old = {
        ...person
    };


    person.name =
        name.trim();

    person.day =
        newDay;

    person.month =
        newMonth;

    person.birthYear =
        newYear;


    sort();

    render();


    try {

        await save(
            `Изменён день рождения: ${person.name}`
        );


        status(
            "✓ Изменения сохранены",
            false
        );


    } catch (error) {

        Object.assign(
            person,
            old
        );

        render();

        status(
            error.message,
            true
        );
    }
}


/* =========================================
   RENDER
========================================= */

function render() {

    renderMonths();

    renderSoon();
}


/* =========================================
   MONTHS
========================================= */

function renderMonths() {

    const container =
        document.getElementById(
            "months"
        );


    container.innerHTML = "";


    MONTHS.forEach(
        (monthName, index) => {

            const monthNumber =
                index + 1;


            const people =
                birthdays
                    .filter(
                        person =>
                            Number(
                                person.month
                            ) ===
                            monthNumber
                    )
                    .sort(
                        compare
                    );


            const article =
                document.createElement(
                    "div"
                );


            article.className =
                "month";


            article.innerHTML = `
                <div class="month-title">
                    ${monthName} · ${people.length}
                </div>
            `;


            const list =
                document.createElement(
                    "ul"
                );


            list.className =
                "month-list";


            if (
                people.length === 0
            ) {

                list.innerHTML = `
                    <li class="empty">
                        Пока никого нет.
                    </li>
                `;
            }


            people.forEach(
                person => {

                    list.appendChild(
                        personElement(
                            person
                        )
                    );
                }
            );


            article.appendChild(
                list
            );


            container.appendChild(
                article
            );
        }
    );
}


/* =========================================
   PERSON
========================================= */

function personElement(
    person
) {

    const item =
        document.createElement(
            "li"
        );


    item.className =
        "person";


    const age =
        getAge(person);


    item.innerHTML = `
        <div class="day">
            ${String(person.day).padStart(2,"0")}
        </div>

        <div class="person-main">

            <div class="person-top">

                <div class="name">
                    ${escapeHtml(person.name)}
                </div>

                <div class="person-buttons">

                    <button
                        class="icon-btn"
                        title="Изменить"
                    >
                        ✎
                    </button>

                    <button
                        class="icon-btn delete"
                        title="Удалить"
                    >
                        ×
                    </button>

                </div>

            </div>

            <div class="age">
                ${age} ${years(age)}
            </div>

        </div>
    `;


    const buttons =
        item.querySelectorAll(
            ".icon-btn"
        );


    buttons[0].onclick =
        () =>
            edit(person);


    buttons[1].onclick =
        () =>
            remove(person);


    return item;
}


/* =========================================
   SOON
========================================= */

function renderSoon() {

    const container =
        document.getElementById(
            "soon"
        );


    container.innerHTML = "";


    if (
        birthdays.length === 0
    ) {

        container.innerHTML = `
            <div class="empty">
                Пока нет записей.
            </div>
        `;

        return;
    }


    const today =
        new Date();


    today.setHours(
        0,0,0,0
    );


    const upcoming =
        birthdays
            .map(
                person => {

                    const date =
                        nextBirthday(
                            person,
                            today
                        );


                    const days =
                        Math.round(
                            (
                                date -
                                today
                            )
                            /
                            86400000
                        );


                    return {
                        person,
                        days
                    };
                }
            )
            .sort(
                (a,b) =>
                    a.days -
                    b.days
            );


    const next =
        upcoming[0];


    container.innerHTML = `
        <div class="soon">

            <div>

                <span class="soon-name">
                    ${escapeHtml(next.person.name)}
                </span>

                <span class="soon-date">
                    · ${formatDate(next.person)}
                </span>

            </div>

            <div class="soon-days">
                ${formatDays(next.days)}
            </div>

        </div>
    `;
}


/* =========================================
   AGE
========================================= */

function getAge(
    person
) {

    const today =
        new Date();


    let age =
        today.getFullYear()
        -
        person.birthYear;


    const birthday =
        new Date(
            today.getFullYear(),
            person.month - 1,
            person.day
        );


    birthday.setHours(
        0,0,0,0
    );


    today.setHours(
        0,0,0,0
    );


    if (
        today < birthday
    ) {

        age--;
    }


    return age;
}


/* =========================================
   NEXT
========================================= */

function nextBirthday(
    person,
    today
) {

    let date =
        new Date(
            today.getFullYear(),
            person.month - 1,
            person.day
        );


    date.setHours(
        0,0,0,0
    );


    if (
        date < today
    ) {

        date =
            new Date(
                today.getFullYear() + 1,
                person.month - 1,
                person.day
            );

        date.setHours(
            0,0,0,0
        );
    }


    return date;
}


/* =========================================
   HELPERS
========================================= */

function compare(a,b) {

    if (
        a.month !== b.month
    ) {

        return a.month - b.month;
    }


    if (
        a.day !== b.day
    ) {

        return a.day - b.day;
    }


    return a.name.localeCompare(
        b.name,
        "ru"
    );
}


function sort() {

    birthdays.sort(
        compare
    );
}


function daysInMonth(
    month
) {

    return new Date(
        2024,
        month,
        0
    ).getDate();
}


function formatDate(
    person
) {

    return (
        String(
            person.day
        ).padStart(2,"0")
        +
        "."
        +
        String(
            person.month
        ).padStart(2,"0")
    );
}


function formatDays(
    days
) {

    if (
        days === 0
    ) return "сегодня 🎉";

    if (
        days === 1
    ) return "завтра";

    return `через ${days} ${daysWord(days)}`;
}


function daysWord(
    n
) {

    n = Math.abs(n) % 100;

    const last =
        n % 10;


    if (
        n >= 11 &&
        n <= 19
    ) return "дней";


    if (
        last === 1
    ) return "день";


    if (
        last >= 2 &&
        last <= 4
    ) return "дня";


    return "дней";
}


function years(
    n
) {

    n = Math.abs(n) % 100;

    const last =
        n % 10;


    if (
        n >= 11 &&
        n <= 19
    ) return "лет";


    if (
        last === 1
    ) return "год";


    if (
        last >= 2 &&
        last <= 4
    ) return "года";


    return "лет";
}

function escapeHtml(
    value
) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


/* =========================================
   BASE64 UTF-8
========================================= */

function encode(
    text
) {

    const bytes =
        new TextEncoder()
            .encode(text);


    let binary = "";


    for (
        let i = 0;
        i < bytes.length;
        i += 0x8000
    ) {

        binary +=
            String.fromCharCode(
                ...bytes.subarray(
                    i,
                    i + 0x8000
                )
            );
    }


    return btoa(
        binary
    );
}


function decode(
    base64
) {

    const binary =
        atob(
            base64.replace(
               (/\n/g),
                ""
            )
        );


    const bytes =
        Uint8Array.from(
            binary,
            char =>
                char.charCodeAt(0)
        );


    return new TextDecoder()
        .decode(bytes);
}
